    <!-- Ensure canonical tag is set correctly before React loads -->
    <script>
      // Map alternative URLs to their canonical versions
      (function() {
        const pathMappings = {
          '/home': '/',
          '/shipping': '/privacy-policy',
          '/shipping-policy': '/privacy-policy',
          '/terms': '/terms-and-conditions',
          '/terms-of-service': '/terms-and-conditions',
          '/contact': '/contact-us',
          '/cancellations-refunds': '/terms-and-conditions'
        };
        
        // Get the current path and map it to canonical if needed
        const currentPath = window.location.pathname;
        const canonicalPath = pathMappings[currentPath] || currentPath;
        const canonicalUrl = 'https://www.knowhowindia.in' + (canonicalPath === '/' ? '' : canonicalPath);
        
        // Remove any existing canonical tags
        const existingCanonicals = document.querySelectorAll('link[rel="canonical"]');
        existingCanonicals.forEach(canonical => canonical.remove());
        
        // Create new canonical tag with the correct URL
        const canonical = document.createElement('link');
        canonical.rel = 'canonical';
        canonical.href = canonicalUrl;
        document.head.appendChild(canonical);
        
        // Also ensure og:url matches
        let ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) {
          ogUrl.content = canonicalUrl;
        } else {
          ogUrl = document.createElement('meta');
          ogUrl.setAttribute('property', 'og:url');
          ogUrl.content = canonicalUrl;
          document.head.appendChild(ogUrl);
        }
      })();
    </script>
